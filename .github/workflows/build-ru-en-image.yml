name: Build RU+EN container image

# Builds the docling-serve image with RapidOCR Russian+English (Cyrillic) OCR
# baked in and pushes it to GHCR as `<version>-ru_en` (version taken from
# pyproject.toml, e.g. 1.20.0-ru_en).
#
# The image bakes the East-Slavic (eslav, PP-OCRv5, onnxruntime) recognition
# model and pre-registers a `rapidocr_ru_en` OCR preset, so it works offline.
# Run it manually from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Build platforms (comma separated)."
        type: string
        default: linux/amd64
      bake_lang:
        description: "RapidOCR PP-OCRv5 recognition model to bake in (eslav covers Cyrillic + Latin)."
        type: string
        default: eslav
      torch_variant:
        description: "PyTorch build to use (matches the official docling-serve image variants)."
        type: choice
        options:
          - cu128
          - cu130
          - pypi
          - cpu
        default: cu128

env:
  GHCR_REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Free up space on the runner
        run: |
          df -h
          sudo rm -rf "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY" \
            /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup
          df -h

      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Compute image tag and preset
        id: vars
        run: |
          set -euo pipefail
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          version="$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          image="${GHCR_REGISTRY}/${owner}/docling-serve"
          lang="${{ inputs.bake_lang }}"
          # Must match DOCLING_SERVE_ARTIFACTS_PATH and the bake step in the Containerfile.
          art="/opt/app-root/src/.cache/docling/models/RapidOcr"
          rec="${art}/onnx/PP-OCRv5/rec/${lang}_PP-OCRv5_rec_mobile.onnx"
          keys="${art}/paddle/PP-OCRv5/rec/${lang}_PP-OCRv5_rec_mobile/ppocrv5_${lang}_dict.txt"
          # Select the PyTorch build, mirroring .github/image-matrix.json. The default
          # `pypi` group is CUDA 12.6 torch from PyPI (same as the standard docling-serve
          # image); cu128/cu130 pin CUDA 12.8/13.0 from download.pytorch.org.
          case "${{ inputs.torch_variant }}" in
            cu128) uv_args="--no-group pypi --group cu128" ;;
            cu130) uv_args="--no-group pypi --group cu130" ;;
            cpu)   uv_args="--no-group pypi --group cpu --no-extra flash-attn" ;;
            *)     uv_args="--no-extra flash-attn" ;;
          esac
          {
            echo "image=${image}"
            echo "tag=${image}:${version}-ru_en"
            echo "uv_args=${uv_args}"
            echo "preset={\"rapidocr_ru_en\":{\"kind\":\"rapidocr\",\"backend\":\"onnxruntime\",\"lang\":[\"english\"],\"rec_model_path\":\"${rec}\",\"rec_keys_path\":\"${keys}\"}}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push RU+EN image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: ${{ inputs.platforms }}
          push: true
          pull: true
          tags: ${{ steps.vars.outputs.tag }}
          build-args: |
            RAPIDOCR_BAKE_LANG=${{ inputs.bake_lang }}
            DOCLING_SERVE_CUSTOM_OCR_PRESETS=${{ steps.vars.outputs.preset }}
            UV_SYNC_EXTRA_ARGS=${{ steps.vars.outputs.uv_args }}

      - name: Summary
        run: |
          echo "Pushed image: ${{ steps.vars.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "PyTorch variant: ${{ inputs.torch_variant }} (UV_SYNC_EXTRA_ARGS='${{ steps.vars.outputs.uv_args }}')" >> "$GITHUB_STEP_SUMMARY"
          echo "Use it with \`\"ocr_preset\": \"rapidocr_ru_en\"\` in convert requests." >> "$GITHUB_STEP_SUMMARY"
